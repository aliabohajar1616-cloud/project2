  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Cairo', Tahoma, sans-serif;
  }

  body {
    background-color: #162e54;
    color: #f1f5f9;
    padding: 20px 15px;
    line-height: 1.6;
  }

  /* رأس الصفحة */
  header {
    text-align: center;
    margin-bottom: 30px;
    padding: 22px 15px;
    background: linear-gradient(135deg, #0f2140 0%, #1d3b6e 100%);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
  }

  header h1 {
    color: #ffffff;
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }

  header p {
    color: #cbd5e1;
    font-size: 1rem;
    opacity: 0.95;
  }

  /* شبكة عرض الأحذية */
  .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* بطاقة المنتج */
  .card {
    background-color: #172554;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.28);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
  }

  .card img {
    width: 100%;
    height: 225px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 15px;
    background-color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .card h3 {
    font-size: 1.25rem;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 8px;
  }

  .card p {
    font-size: 0.95rem;
    color: #cbd5e1;
    margin-bottom: 6px;
  }

  .card p strong {
    color: #fbbf24; /* لمسة ذهبية دافئة تبرز السعر والكود */
    font-weight: 700;
  }

  /* حقول الطلب */
  .form-group {
    margin-top: 12px;
  }

  .form-group label {
    display: block;
    font-size: 0.88rem;
    font-weight: 600;
    color: #e2e8f0;
    margin-bottom: 5px;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    padding: 11px 12px;
    background-color: #0e1a36;
    color: #ffffff;
    border: 1px solid #3b5998;
    border-radius: 10px;
    font-size: 0.95rem;
    margin-bottom: 10px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .form-group input::placeholder {
    color: #94a3b8;
  }

  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  }

  /* زر واتساب احترافي */
  .btn-whatsapp {
    background: linear-gradient(135deg, #25d366 0%, #1ebe5d 100%);
    color: #ffffff;
    border: none;
    padding: 13px 16px;
    width: 100%;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }

  .btn-whatsapp:hover {
    filter: brightness(1.06);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(37, 211, 102, 0.45);
  }

  .btn-whatsapp:active {
    transform: translateY(0);
  }
</style>

        ];

        const container = document.getElementById('products-container');

        products.forEach(product => {
            let sizeOptions = '';
            product.sizes.forEach(size => {
                const isSelected = (size === "40") ? ' selected' : '';
                sizeOptions += '<option value="' + size + '"' + isSelected + '>مقاس ' + size + '</option>';
            });

            const card = document.createElement('div');    
            card.className = 'card';
            card.innerHTML = 
                '<div>' +
                    '<img src="' + product.image + '" alt="' + product.name + '" onerror="this.src=\'https://via.placeholder.com/300x220?text=Khotwa+Shoes\'">' +
                    '<h3>' + product.name + '</h3>' +
                    '<p><strong>كود المنتج:</strong> ' + product.code + '</p>' +
                    '<p><strong>اللون:</strong> ' + product.color + '</p>' +
                    '<p><strong>السعر:</strong> ' + product.price + '</p>' +
                '</div>' +
                '<div>' +
                    '<div class="form-group">' +
                        '<label>اختر المقاس *</label>' +
                        '<select id="size-' + product.id + '">' +
                            sizeOptions +
                        '</select>' +
                    '</div>' +
                    '<div class="form-group">' +
                        '<label>الكمية المطلوبة *</label>' +
                        '<input type="number" id="qty-' + product.id + '" value="1" min="1" required>' +
                    '</div>' +
                    '<div class="form-group">' +
                        '<label>الاسم الثلاثي *</label>' +
                        '<input type="text" id="name-' + product.id + '" placeholder="أدخل اسمك الثلاثي" required>' +
                    '</div>' +
                    '<div class="form-group">' +
                        '<label>رقم الهاتف *</label>' +
                        '<input type="tel" id="phone-' + product.id + '" placeholder="09X XXXXXXX" required>' +
                    '</div>' +
                    '<div class="form-group">' +
                        '<label>العنوان (المدينة، المنطقة، الشارع) *</label>' +
                        '<input type="text" id="address-' + product.id + '" placeholder="أدخل عنوانك بالتفصيل" required>' +
                    '</div>' +
                    '<button class="btn-whatsapp" onclick="sendOrder(' + product.id + ')">طلب عبر الواتساب</button>' +
                '</div>';
            container.appendChild(card);
        });

        function sendOrder(id) {
            const product = products.find(p => p.id === id);
            const size = document.getElementById("size-" + id).value;
            const qty = document.getElementById("qty-" + id).value.trim();
            const name = document.getElementById("name-" + id).value.trim();
            const phone = document.getElementById("phone-" + id).value.trim();
            const address = document.getElementById("address-" + id).value.trim();

            if (!qty || !name || !phone || !address) {
                alert("الرجاء تعبئة جميع الحقول الإجبارية (الكمية، الاسم، الهاتف، العنوان)!");
                return;
            }

            const imageUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1) + product.image;

            const message = "طلب حذاء جديد - متجر خطوة إلى الأمام\n\n" +
                "رابط الصورة: " + imageUrl + "\n" +
                "اسم المنتج: " + product.name + "\n" +
                "كود المنتج: " + product.code + "\n" +
                "اللون: " + product.color + "\n" +
                "المقاس: " + size + "\n" +
                "السعر: " + product.price + "\n" +
                "الكمية المطلوبة: " + qty + "\n" +
                "الاسم الثلاثي: " + name + "\n" +
                "رقم الهاتف: " + phone + "\n" +
                "العنوان الإجباري: " + address;

            const merchantPhone = "218926192882";
            const whatsappUrl = "https://wa.me/" + merchantPhone + "?text=" + encodeURIComponent(message);
            window.open(whatsappUrl, '_blank');
        }
