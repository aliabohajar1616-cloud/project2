<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر خطوة إلى الأمام - Khotwa Shoes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', Tahoma, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #2a2a2a;
        }
        .card h3 {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .card p {
            font-size: 0.95rem;
            color: #b0b0b0;
            margin-bottom: 5px;
        }
        .form-group {
            margin-top: 10px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 3px;
            color: #ccc;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #2c2c2c;
            color: #fff;
            margin-bottom: 8px;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

    <header>
        <h1>خطوة إلى الأمام (Khotwa Shoes)</h1>
        <p>اختر منتجك، أدخل بياناتك، واطلب مباشرة عبر الواتساب</p>
    </header>

    <div class="container" id="products-container">
        <!-- يتم توليد المنتجات ديناميكياً -->
    </div>

    <script>
        const products = [
            { id: 2, name: "حذاء كاجوال مريح", code: "1015", color: "رمادي أسود", price: "150 دينار", image: "shoe2.png" },
            { id: 3, name: "حذاء كاجوال مريح", code: "1015", color: "أسود كحلي", price: "150 دينار", image: "shoe3.jpg" },
            { id: 4, name: "حذاء كاجوال مريح", code: "1015", color: "أزرق مريح", price: "150 دينار", image: "shoe4.jpg" },
            { id: 5, name: "حذاء كاجوال مريح", code: "1015", color: "أزرق غامق", price: "150 دينار", image: "shoe5.jpg" },
            { id: 6, name: "حذاء بيج كلاسيك", code: "1013", color: "أبيض / بني", price: "130 دينار", image: "shoe6.jpg" },
            { id: 7, name: "حذاء كاجوال مريح", code: "1036", color: "أبيض ناصع / أزرق", price: "130 دينار", image: "shoe7.jpg" },
            { id: 8, name: "حذاء كاجوال خفيف", code: "1036", color: "أبيض ناصع", price: "130 دينار", image: "shoe8.jpg" },
            { id: 9, name: "حذاء سبورت عصري", code: "1036", color: "كحلي أبيض", price: "130 دينار", image: "shoe9.jpg" },
            { id: 10, name: "حذاء كاجوال خفيف", code: "1030", color: "أبيض أزرق", price: "130 دينار", image: "shoe10.jpg" },
            { id: 11, name: "حذاء رياضي عصري", code: "1034", color: "أبيض رمادي", price: "130 دينار", image: "shoe11.jpg" },
            { id: 13, name: "حذاء كاجوال خفيف", code: "1034", color: "أبيض + أسود", price: "130 دينار", image: "shoe13.jpg" },
            { id: 14, name: "حذاء سبورت خفيف", code: "1033", color: "أبيض رمادي", price: "130 دينار", image: "shoe14.jpg" },
            { id: 16, name: "حذاء بوت مرتفع", code: "1020", color: "رمادي / رصاصي", price: "130 دينار", image: "shoe16.jpg" },
            { id: 17, name: "حذاء بوت سبورت", code: "1020", color: "أسود سبورت", price: "130 دينار", image: "shoe17.jpg" },
            { id: 18, name: "حذاء عصري مميز", code: "1030", color: "أبيض أسود", price: "130 دينار", image: "shoe18.jpg" },
            { id: 20, name: "حذاء سبورت مرتفع", code: "1012", color: "أسود مرتفع", price: "130 دينار", image: "shoe20.jpg" },
            { id: 21, name: "حذاء سبورت أنيق", code: "1030", color: "أبيض أزرق", price: "130 دينار", image: "shoe21.jpg" },
            { id: 22, name: "حذاء سبورت مريح", code: "1012", color: "أسود × رمادي", price: "130 دينار", image: "shoe22.jpg" },
            { id: 23, name: "حذاء كاجوال شبابي", code: "1036", color: "أبيض ناصع أزرق", price: "130 دينار", image: "shoe23.jpg" },
            { id: 25, name: "حذاء كاجوال شبابي", code: "1013", color: "أبيض أسود", price: "130 دينار", image: "shoe25.jpg" },
            { id: 26, name: "حذاء مريح وأنيق", code: "1015", color: "بني كاجوال", price: "150 دينار", image: "shoe26.jpg" },
            { id: 27, name: "حذاء كاجوال شبابي", code: "1015", color: "رمادي خفيف أسود", price: "150 دينار", image: "shoe27.jpg" },
            { id: 28, name: "حذاء كاجوال شبابي", code: "1036", color: "أبيض رياضي", price: "130 دينار", image: "shoe28.jpg" },
            { id: 29, name: "حذاء كاجوال أنيق", code: "1036", color: "أبيض ناصع", price: "130 دينار", image: "shoe29.jpg" },
            { id: 30, name: "حذاء كاجوال فاخر", code: "1011", color: "أسود كاجوال", price: "95 دينار", image: "shoe30.jpg" },
            { id: 31, name: "حذاء سبورت عصري", code: "1036", color: "أبيض ناصع", price: "130 دينار", image: "shoe31.jpg" },
            { id: 32, name: "حذاء سبورت عصري", code: "1036", color: "أبيض ناصع برتقالي", price: "130 دينار", image: "shoe32.jpg" },
            { id: 33, name: "حذاء سبورت عصري", code: "1011", color: "أسود كحلي", price: "95 دينار", image: "shoe33.jpg" },
            { id: 34, name: "حذاء سبورت عصري", code: "1011", color: "رمادي خفيف أبيض", price: "95 دينار", image: "shoe34.jpg" },
            { id: 35, name: "حذاء سبورت عصري", code: "1011", color: "أزرق ملكي", price: "95 دينار", image: "shoe35.jpg" }
        ];

        const container = document.getElementById('products-container');

        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = 
                '<div>' +
                    '<img src="' + product.image + '" alt="' + product.name + '" onerror="this.src=\'https://via.placeholder.com/300x220?text=Khotwa+Shoes\'">' +
                    '<h3>' + product.name + '</h3>' +
                    '<p><strong>كود المنتج:</strong> ' + product.code + '</p>' +
                    '<p><strong>اللون:</strong> ' + product.color + '</p>' +
                    '<p><strong>السعر:</strong> ' + product.price + '</p>' +
                '</div>' +
                '<div>' +
                    '<div class="form-group">' +
                        '<label>المقاس المطلوب *</label>' +
                        '<select id="size-' + product.id + '" required>' +
                            '<option value="">اختر المقاس</option>' +
                            '<option value="40">40</option>' +
                            '<option value="41">41</option>' +
                            '<option value="42">42</option>' +
                            '<option value="43">43</option>' +
                            '<option value="44">44</option>' +
                            '<option value="45">45</option>' +
                        '</select>' +
                    '</div>' +
                    '<div class="form-group">' +
                        '<label>الاسم الثلاثي *</label>' +
                        '<input type="text" id="name-' + product.id + '" placeholder="أدخل اسمك الثلاثي" required>' +
                    '</div>' +
                    '<div class="form-group">' +
                        '<label>رقم الهاتف *</label>' +
                        '<input type="tel" id="phone-' + product.id + '" placeholder="09X XXXXXXX" required>' +
                    '</div>' +
                    '<div class="form-group">' +
                        '<label>العنوان (المدينة، المنطقة، الشارع) *</label>' +
                        '<input type="text" id="address-' + product.id + '" placeholder="أدخل عنوانك بالتفصيل" required>' +
                    '</div>' +
                    '<button class="btn-whatsapp" onclick="sendOrder(' + product.id + ')">طلب عبر الواتساب</button>' +
                '</div>';
            container.appendChild(card);
        });

        function sendOrder(id) {
            const product = products.find(p => p.id === id);
            const size = document.getElementById("size-" + id).value;
            const name = document.getElementById("name-" + id).value.trim();
            const phone = document.getElementById("phone-" + id).value.trim();
            const address = document.getElementById("address-" + id).value.trim();

            if (!size || !name || !phone || !address) {
                alert("الرجاء تعبئة جميع الحقول الإجبارية (المقاس، الاسم، الهاتف، العنوان)!");
                return;
            }

            const currentDomain = window.location.origin;
            const imageUrl = currentDomain + "/" + product.image;

            const message = "طلب حذاء جديد - متجر خطوة إلى الأمام\n\n" +
                "رابط الصورة: " + imageUrl + "\n" +
                "اسم المنتج: " + product.name + "\n" +
                "كود المنتج: " + product.code + "\n" +
                "اللون: " + product.color + "\n" +
                "السعر: " + product.price + "\n" +
                "المقاس الإجباري: " + size + "\n" +
                "الكمية: 1\n" +
                "الاسم الثلاثي: " + name + "\n" +
                "رقم الهاتف: " + phone + "\n" +
                "العنوان الإجباري: " + address;

            const merchantPhone = "218926192882";
            const whatsappUrl = "https://wa.me/" + merchantPhone + "?text=" + encodeURIComponent(message);
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
